<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CapturAir Météo — Briefing Aviation</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --navy: #0B1F3A;
  --navy-light: #112644;
  --navy-card: #0F2444;
  --blue: #1A8FD1;
  --blue-light: #3AABEF;
  --teal: #1ABC9C;
  --orange: #E67E22;
  --red: #E74C3C;
  --green: #27AE60;
  --green-light: #2ECC71;
  --purple: #9B59B6;
  --yellow: #F1C40F;
  --offwhite: #F4F7FA;
  --gray: #6B7C93;
  --gray-light: #8899AA;
  --border: #1A3050;
  --border-light: #223355;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --radius: 12px;
  --radius-sm: 8px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'DM Sans',sans-serif;
  font-weight:300;
  background:var(--navy);
  color:var(--offwhite);
  display:flex;
  flex-direction:column;
}

/* ─── AUTH ─── */
#auth-screen{
  position:fixed;inset:0;
  background:linear-gradient(135deg,#060f1e 0%,#0B1F3A 50%,#0a1929 100%);
  display:flex;align-items:center;justify-content:center;
  z-index:9999;
}
.auth-box{
  background:var(--navy-card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:48px 40px;
  width:380px;
  text-align:center;
  box-shadow:0 24px 80px rgba(0,0,0,0.6);
}
.auth-logo{
  font-family:'Syne',sans-serif;
  font-size:22px;font-weight:800;
  color:var(--blue-light);
  letter-spacing:2px;
  margin-bottom:6px;
}
.auth-sub{font-size:12px;color:var(--gray);letter-spacing:1px;margin-bottom:36px;}
.auth-label{font-size:11px;color:var(--gray-light);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;text-align:left;}
.auth-input{
  width:100%;padding:14px 16px;
  background:#071628;border:1px solid var(--border);
  border-radius:var(--radius-sm);color:var(--offwhite);
  font-family:'DM Sans',sans-serif;font-size:15px;
  letter-spacing:3px;text-align:center;
  transition:border-color 0.2s;
  margin-bottom:16px;
}
.auth-input:focus{outline:none;border-color:var(--blue);}
.auth-btn{
  width:100%;padding:14px;
  background:var(--blue);border:none;border-radius:var(--radius-sm);
  color:#fff;font-family:'Syne',sans-serif;font-weight:700;
  font-size:14px;letter-spacing:1px;cursor:pointer;
  transition:background 0.2s,transform 0.1s;
}
.auth-btn:hover{background:var(--blue-light);}
.auth-btn:active{transform:scale(0.98);}
.auth-error{color:var(--red);font-size:12px;margin-top:8px;min-height:18px;}
.auth-info{color:var(--gray);font-size:12px;margin-top:12px;}

/* ─── TOPBAR ─── */
#topbar{
  height:56px;
  background:var(--navy-card);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;
  padding:0 16px;gap:12px;
  flex-shrink:0;
  z-index:100;
}
.logo{
  font-family:'Syne',sans-serif;font-weight:800;
  font-size:16px;color:var(--blue-light);
  letter-spacing:2px;white-space:nowrap;
}
.logo span{color:var(--teal);}
#search-bar{
  flex:1;max-width:340px;
  padding:8px 14px;
  background:#071628;border:1px solid var(--border);
  border-radius:20px;color:var(--offwhite);
  font-family:'DM Sans',sans-serif;font-size:13px;
}
#search-bar:focus{outline:none;border-color:var(--blue);}
#coords-input{
  width:200px;padding:8px 14px;
  background:#071628;border:1px solid var(--border);
  border-radius:20px;color:var(--offwhite);
  font-family:'DM Mono',monospace;font-size:12px;
  placeholder-color:var(--gray);
}
#coords-input:focus{outline:none;border-color:var(--teal);}
#btn-coords{
  padding:8px 14px;background:var(--teal);border:none;
  border-radius:20px;color:#fff;font-size:12px;
  font-family:'Syne',sans-serif;font-weight:600;
  cursor:pointer;white-space:nowrap;
}
#btn-coords:hover{background:#16a085;}
.tz-badge{
  background:#071628;border:1px solid var(--border);
  border-radius:20px;padding:6px 12px;
  font-family:'DM Mono',monospace;font-size:11px;
  color:var(--teal);white-space:nowrap;
}
#btn-logout{
  padding:7px 14px;background:transparent;
  border:1px solid var(--border);border-radius:20px;
  color:var(--gray);font-size:11px;cursor:pointer;
  margin-left:auto;white-space:nowrap;
}
#btn-logout:hover{border-color:var(--red);color:var(--red);}

/* ─── MAIN LAYOUT ─── */
#main{
  display:flex;flex:1;overflow:hidden;
}
#map-panel{
  width:35%;min-width:280px;
  position:relative;
  border-right:1px solid var(--border);
  flex-shrink:0;
}
#map{width:100%;height:100%;}

/* MAP CONTROLS */
#map-controls{
  position:absolute;top:10px;left:10px;
  display:flex;flex-direction:column;gap:6px;
  z-index:10;
}
.map-btn{
  padding:6px 10px;
  background:rgba(11,31,58,0.92);
  border:1px solid var(--border);border-radius:6px;
  color:var(--offwhite);font-size:11px;cursor:pointer;
  font-family:'DM Sans',sans-serif;
  transition:background 0.15s;white-space:nowrap;
}
.map-btn:hover{background:var(--navy-card);}
.map-btn.active{background:var(--blue);border-color:var(--blue);}

/* ZONES ALERT BANNER */
#zones-banner{
  position:absolute;bottom:10px;left:10px;right:10px;
  z-index:10;display:none;
}
.zones-banner-inner{
  background:rgba(11,31,58,0.95);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:10px 12px;
  font-size:11px;
  max-height:140px;overflow-y:auto;
}

/* ─── DATA PANEL ─── */
#data-panel{
  flex:1;overflow:hidden;
  display:flex;flex-direction:column;
}
#tabs{
  display:flex;
  border-bottom:1px solid var(--border);
  background:var(--navy-card);
  flex-shrink:0;
}
.tab{
  flex:1;padding:14px 8px;
  background:transparent;border:none;
  color:var(--gray);
  font-family:'Syne',sans-serif;font-weight:600;
  font-size:12px;letter-spacing:0.5px;
  cursor:pointer;
  border-bottom:2px solid transparent;
  transition:color 0.2s,border-color 0.2s;
}
.tab:hover{color:var(--offwhite);}
.tab.active{color:var(--blue-light);border-bottom-color:var(--blue-light);}
#tab-content{
  flex:1;overflow-y:auto;
  padding:16px;
  scrollbar-width:thin;
  scrollbar-color:var(--border) transparent;
}

/* ─── EMPTY STATE ─── */
#empty-state{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  height:100%;
  color:var(--gray);text-align:center;
  gap:12px;
}
#empty-state .empty-icon{font-size:48px;opacity:0.4;}
#empty-state p{font-size:13px;max-width:280px;line-height:1.6;}

/* ─── LOADING ─── */
#loading-overlay{
  display:none;
  position:absolute;inset:0;
  background:rgba(11,31,58,0.85);
  z-index:50;
  align-items:center;justify-content:center;
  flex-direction:column;gap:12px;
  border-radius:0;
}
#loading-overlay.show{display:flex;}
.spinner{
  width:36px;height:36px;
  border:3px solid var(--border);
  border-top-color:var(--blue);
  border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:12px;color:var(--gray);}

/* ─── CARDS ─── */
.card{
  background:var(--navy-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
}
.card-title{
  font-family:'Syne',sans-serif;font-weight:700;
  font-size:11px;letter-spacing:1.5px;
  color:var(--gray);text-transform:uppercase;
  margin-bottom:14px;
  display:flex;align-items:center;gap:8px;
}
.card-title .icon{font-size:14px;}

/* ─── VERDICT ─── */
#verdict-card{
  border-width:2px;
  margin-bottom:12px;
}
#verdict-card.vert{border-color:var(--green);}
#verdict-card.orange{border-color:var(--orange);}
#verdict-card.rouge{border-color:var(--red);}
.verdict-main{
  display:flex;align-items:center;gap:16px;
}
.verdict-dot{
  width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;flex-shrink:0;
}
.verdict-dot.vert{background:rgba(39,174,96,0.2);box-shadow:0 0 20px rgba(39,174,96,0.3);}
.verdict-dot.orange{background:rgba(230,126,34,0.2);box-shadow:0 0 20px rgba(230,126,34,0.3);}
.verdict-dot.rouge{background:rgba(231,76,60,0.2);box-shadow:0 0 20px rgba(231,76,60,0.3);}
.verdict-text{}
.verdict-status{
  font-family:'Syne',sans-serif;font-weight:800;
  font-size:16px;
}
.verdict-status.vert{color:var(--green-light);}
.verdict-status.orange{color:var(--orange);}
.verdict-status.rouge{color:var(--red);}
.verdict-reason{font-size:12px;color:var(--gray-light);margin-top:3px;}
.verdict-score{
  margin-left:auto;text-align:center;flex-shrink:0;
}
.score-num{
  font-family:'Syne',sans-serif;font-weight:800;
  font-size:28px;color:var(--blue-light);
}
.score-label{font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:1px;}
.verdict-details{
  margin-top:12px;padding-top:12px;
  border-top:1px solid var(--border);
  display:flex;flex-wrap:wrap;gap:6px;
}
.verdict-chip{
  padding:3px 10px;border-radius:20px;
  font-size:11px;font-weight:500;
}
.chip-ok{background:rgba(39,174,96,0.15);color:var(--green-light);border:1px solid rgba(39,174,96,0.3);}
.chip-warn{background:rgba(230,126,34,0.15);color:var(--orange);border:1px solid rgba(230,126,34,0.3);}
.chip-danger{background:rgba(231,76,60,0.15);color:var(--red);border:1px solid rgba(231,76,60,0.3);}

/* ─── GRID METRICS ─── */
.metrics-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.metric{
  background:#071628;
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:12px;
  cursor:pointer;
  transition:border-color 0.2s;
  position:relative;
}
.metric:hover{border-color:var(--blue);}
.metric-label{
  font-size:10px;color:var(--gray);
  text-transform:uppercase;letter-spacing:1px;
  margin-bottom:4px;
  display:flex;align-items:center;gap:4px;
}
.metric-label .info-icon{
  width:14px;height:14px;
  background:var(--border);border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:8px;color:var(--gray-light);
  cursor:pointer;flex-shrink:0;
  transition:background 0.15s;
}
.metric:hover .info-icon{background:var(--blue);}
.metric-value{
  font-family:'Syne',sans-serif;font-weight:700;
  font-size:20px;color:var(--offwhite);
}
.metric-sub{font-size:11px;color:var(--gray-light);margin-top:2px;}
.metric-badge{
  display:inline-block;
  padding:2px 8px;border-radius:20px;
  font-size:10px;font-weight:600;
  margin-top:4px;
}
.badge-ok{background:rgba(39,174,96,0.2);color:var(--green-light);}
.badge-warn{background:rgba(230,126,34,0.2);color:var(--orange);}
.badge-danger{background:rgba(231,76,60,0.2);color:var(--red);}
.badge-info{background:rgba(26,143,209,0.2);color:var(--blue-light);}

/* Wind arrow */
.wind-arrow{
  display:inline-block;
  font-size:20px;
  transition:transform 0.5s ease;
}

/* ─── DRONE BLOCK ─── */
.drone-block{
  background:linear-gradient(135deg,rgba(26,143,209,0.08),rgba(26,188,156,0.05));
  border:1px solid rgba(26,143,209,0.3);
  border-radius:var(--radius);
  padding:14px;
  margin-bottom:12px;
}
.drone-title{
  font-family:'Syne',sans-serif;font-weight:700;font-size:12px;
  color:var(--blue-light);letter-spacing:1px;margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.drone-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
}
.drone-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:6px 0;
  border-bottom:1px solid var(--border);
  font-size:12px;
  grid-column:span 2;
}
.drone-row:last-child{border-bottom:none;}
.drone-key{color:var(--gray);}
.drone-val{font-weight:500;font-family:'DM Mono',monospace;font-size:11px;}
.drone-tip{
  margin-top:10px;padding:8px 10px;
  background:rgba(241,196,15,0.08);
  border-left:3px solid var(--yellow);
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  font-size:11px;color:var(--yellow);
  line-height:1.5;
}

/* ─── SOLEIL ─── */
.sun-row{
  display:flex;justify-content:space-between;
  padding:6px 0;
  border-bottom:1px solid var(--border);
  font-size:12px;
}
.sun-row:last-child{border-bottom:none;}
.sun-key{color:var(--gray);}
.sun-val{font-weight:500;font-family:'DM Mono',monospace;font-size:12px;color:var(--yellow);}
.sun-val.legal{color:var(--orange);}
.sun-val.golden{color:#f39c12;}

/* ─── METAR ─── */
.metar-raw{
  background:#050e1a;border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:10px 12px;
  font-family:'DM Mono',monospace;font-size:11px;
  color:var(--blue-light);line-height:1.6;
  word-break:break-all;margin-bottom:10px;
}
.metar-decoded{}
.metar-line{
  display:flex;align-items:flex-start;gap:8px;
  padding:5px 0;border-bottom:1px solid var(--border);
  font-size:12px;
}
.metar-line:last-child{border-bottom:none;}
.metar-key{
  color:var(--gray);font-size:10px;
  text-transform:uppercase;letter-spacing:0.5px;
  min-width:80px;flex-shrink:0;
}
.metar-val{color:var(--offwhite);}

/* ─── ZONES PANEL ─── */
.zones-panel{
  background:rgba(7,22,40,0.8);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px;
  margin-bottom:12px;
}
.zone-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:8px 0;
  border-bottom:1px solid var(--border);
  font-size:12px;
}
.zone-item:last-child{border-bottom:none;}
.zone-dot{
  width:10px;height:10px;border-radius:50%;
  flex-shrink:0;margin-top:3px;
}
.zone-dot.rouge{background:var(--red);}
.zone-dot.orange{background:var(--orange);}
.zone-dot.jaune{background:var(--yellow);}
.zone-dot.bleu{background:var(--blue);}
.zone-info{}
.zone-name{font-weight:500;color:var(--offwhite);}
.zone-dist{color:var(--gray);font-size:11px;}
.zone-notes{color:var(--gray-light);font-size:11px;margin-top:2px;font-style:italic;}
.navdrone-btn{
  display:flex;align-items:center;gap:8px;
  padding:10px 16px;
  background:rgba(26,143,209,0.1);
  border:1px solid rgba(26,143,209,0.3);
  border-radius:var(--radius-sm);
  color:var(--blue-light);
  font-size:12px;font-weight:500;
  cursor:pointer;text-decoration:none;
  margin-top:10px;
  transition:background 0.2s;
}
.navdrone-btn:hover{background:rgba(26,143,209,0.2);}

/* ─── GRAPHIQUE 24H ─── */
.chart-container{
  position:relative;height:160px;
  margin-top:8px;
}

/* ─── ONGLET 2 — 7 jours ─── */
.days-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
  margin-bottom:14px;
}
@media(max-width:900px){
  .days-grid{grid-template-columns:repeat(4,1fr);}
}
.day-card{
  background:var(--navy-card);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:10px 6px;
  text-align:center;
  cursor:pointer;
  transition:border-color 0.2s,transform 0.1s;
}
.day-card:hover{border-color:var(--blue);transform:translateY(-1px);}
.day-card.selected{border-color:var(--blue-light);background:#0f2a4a;}
.day-card.vert{border-top:3px solid var(--green);}
.day-card.orange{border-top:3px solid var(--orange);}
.day-card.rouge{border-top:3px solid var(--red);}
.day-name{font-size:10px;color:var(--gray);font-weight:600;letter-spacing:0.5px;}
.day-date{font-size:9px;color:var(--gray);margin-bottom:4px;}
.day-icon{font-size:20px;margin:4px 0;}
.day-temp{font-size:11px;font-weight:600;color:var(--offwhite);}
.day-wind{font-size:10px;color:var(--gray-light);margin-top:2px;}
.day-score{
  font-family:'Syne',sans-serif;font-weight:800;
  font-size:14px;margin-top:4px;
}
.day-score.vert{color:var(--green-light);}
.day-score.orange{color:var(--orange);}
.day-score.rouge{color:var(--red);}
.day-window{
  font-size:9px;color:var(--teal);
  margin-top:3px;line-height:1.3;
}

/* Heatmap vent */
.heatmap{
  display:grid;
  grid-template-columns:60px repeat(8,1fr);
  gap:2px;
  font-size:10px;
  margin-top:8px;
}
.hm-label{
  color:var(--gray);
  display:flex;align-items:center;
  font-size:9px;
  padding-left:2px;
}
.hm-time{
  color:var(--gray);text-align:center;
  font-family:'DM Mono',monospace;font-size:9px;
  padding:2px 0;
}
.hm-cell{
  height:24px;border-radius:3px;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:500;color:rgba(255,255,255,0.8);
  cursor:default;
}

/* ─── ONGLET 3 — 15 jours ─── */
.days-list{}
.list-header{
  display:grid;
  grid-template-columns:80px 1fr 80px 70px 60px 50px 80px;
  gap:6px;padding:6px 10px;
  font-size:10px;color:var(--gray);
  text-transform:uppercase;letter-spacing:0.5px;
  border-bottom:1px solid var(--border);
}
.list-row{
  display:grid;
  grid-template-columns:80px 1fr 80px 70px 60px 50px 80px;
  gap:6px;padding:8px 10px;
  font-size:12px;
  border-bottom:1px solid var(--border);
  align-items:center;
  transition:background 0.15s;
  cursor:pointer;
}
.list-row:hover{background:rgba(26,143,209,0.05);}
.list-row.low-confidence{opacity:0.55;}
.list-row.favorable{background:rgba(39,174,96,0.05);}
.confidence-badge{
  font-size:9px;padding:2px 6px;border-radius:10px;
  background:rgba(230,126,34,0.15);color:var(--orange);
}
.window-favorable{
  background:rgba(39,174,96,0.1);
  border:1px solid rgba(39,174,96,0.3);
  border-radius:var(--radius-sm);
  padding:8px 12px;
  margin-bottom:8px;
  font-size:12px;
}
.window-favorable-title{
  font-family:'Syne',sans-serif;font-weight:700;
  font-size:11px;color:var(--green-light);
  letter-spacing:0.5px;margin-bottom:4px;
}

/* ─── RÉSUMÉ HEBDO ─── */
.weekly-summary{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  margin-bottom:14px;
}
.week-block{
  background:var(--navy-card);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:12px;
}
.week-title{font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.week-stat{
  font-family:'Syne',sans-serif;font-weight:800;
  font-size:22px;color:var(--blue-light);
}
.week-sub{font-size:11px;color:var(--gray-light);margin-top:2px;}

/* ─── INFO POPUP ─── */
#info-popup{
  position:fixed;
  background:var(--navy-card);
  border:1px solid var(--border-light);
  border-radius:var(--radius);
  padding:20px;
  width:320px;
  z-index:1000;

const PIN_CORRECT = '1977';

async function verifierPIN() {
  const pin = document.getElementById('pin-input').value;
  if(pinTentatives >= 3){
    document.getElementById('pin-error').textContent = 'Trop de tentatives. Réessayez dans 30 min.';
    return;
  }
  if(pin !== PIN_CORRECT){
    pinTentatives++;
    document.getElementById('pin-error').textContent = `PIN incorrect (${pinTentatives}/3)`;
    document.getElementById('pin-input').value='';
    return;
  }
  // Envoyer OTP
  try {
    const r = await fetch(`${API_AUTH}/api/carnet/auth/init`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
     body:JSON.stringify({email:'mohand.aidi@mohand.ca', pin})
    });
    const d = await r.json();
    if(d.success || r.ok){
      document.getElementById('auth-pin-step').style.display='none';
      document.getElementById('auth-otp-step').style.display='block';
    } else {
      document.getElementById('pin-error').textContent = d.error || 'Erreur serveur';
    }
  } catch(e) {
    // Mode offline / dev : passer directement
    document.getElementById('auth-pin-step').style.display='none';
    document.getElementById('auth-otp-step').style.display='block';
  }
}

async function verifierOTP() {
  const otp = document.getElementById('otp-input').value.trim();
if(!otp || otp.length < 6){ document.getElementById('otp-error').textContent='Code OTP invalide'; return; }
  try {
    const r = await fetch(`${API_AUTH}/api/carnet/auth/otp`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:'mohand.aidi@mohand.ca', otp})
    });
    const d = await r.json();
    if(d.token){
      jwt = d.token;
      sessionStorage.setItem('capturair_jwt_meteo', jwt);
      lancerPortail();
    } else {
      document.getElementById('otp-error').textContent = d.error || 'OTP invalide';
    }
  } catch(e) {
    document.getElementById('otp-error').textContent = 'Erreur de connexion';
  }
}

function deconnexion() {
  sessionStorage.removeItem('capturair_jwt_meteo');
  location.reload();
}

// ZONES AÉRIENNES
// ═══════════════════════════════════════════════════════
function haversine(lat1,lng1,lat2,lng2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function dessinerZones(){
  const couleurs = {
    international:'#E74C3C', regional:'#E67E22', militaire_civil:'#E74C3C',
    aeroport_regional:'#E67E22', militaire:'#9B59B6', militaire_aeroport:'#9B59B6',
    nucleaire:'#E74C3C', nucleaire_recherche:'#E74C3C',
    prison:'#E67E22', parc_national:'#27AE60', parc_provincial:'#27AE60',
    reserve:'#27AE60', reserve_biosphere:'#27AE60',
    gouvernemental:'#E74C3C', telecom:'#F1C40F', industriel:'#E67E22',
    infrastructure:'#E67E22', energie:'#F1C40F', heliport:'#3AABEF',
  };

  const toutes = [
    ...ZONES.aeroports.map(z=>({...z,rayon:z.rayon_ctr_km})),
    ...ZONES.militaire.map(z=>({...z,rayon:z.rayon_km})),
    ...ZONES.nucleaire.map(z=>({...z,rayon:z.rayon_km})),
    ...ZONES.prisons.map(z=>({...z,rayon:z.rayon_km})),
    ...ZONES.parcs.map(z=>({...z,rayon:z.rayon_km})),
    ...ZONES.sensibles.map(z=>({...z,rayon:z.rayon_km})),
  ];

  toutes.forEach(z => {
    if(!z.rayon) return;
    const couleur = couleurs[z.type] || '#6B7C93';
    const c = new google.maps.Circle({
      map, center:{lat:z.lat,lng:z.lng},
      radius:z.rayon*1000,
      fillColor:couleur, fillOpacity:0.08,
      strokeColor:couleur, strokeOpacity:0.6, strokeWeight:1.5,
    });
    // InfoWindow au clic
    c.addListener('click', () => {
      new google.maps.InfoWindow({
        content:`<div style="background:#0B1F3A;color:#F4F7FA;padding:10px;border-radius:6px;font-family:DM Sans,sans-serif;font-size:12px;max-width:220px">
          <b style="color:#3AABEF">${z.nom || z.icao}</b><br>
          <span style="color:#6B7C93">${z.type}</span><br>
          <span>${z.notes}</span>
        </div>`
      }).open(map, {latLng:{lat:z.lat,lng:z.lng}});
    });
    zonesCircles.push(c);
  });
}

function verifierZones(lat, lng) {
  const toutes = [
    ...ZONES.aeroports.map(z=>({...z,rayon:z.rayon_ctr_km,alerte:z.rayon_alerte_km})),
    ...ZONES.militaire.map(z=>({...z,rayon:z.rayon_km,alerte:z.rayon_alerte_km})),
    ...ZONES.nucleaire.map(z=>({...z,rayon:z.rayon_km,alerte:z.rayon_alerte_km})),
    ...ZONES.prisons.map(z=>({...z,rayon:z.rayon_km,alerte:z.rayon_alerte_km})),
    ...ZONES.parcs.map(z=>({...z,rayon:z.rayon_km,alerte:z.rayon_alerte_km})),
    ...ZONES.sensibles.map(z=>({...z,rayon:z.rayon_km,alerte:z.rayon_alerte_km})),
  ];

  const critiques=[], vigilance=[], informatif=[], lointaines=[];

  toutes.forEach(z => {
    const dist = haversine(lat,lng,z.lat,z.lng);
    const nom = z.nom || z.icao;
    const r = z.rayon || 1;
    const a = z.alerte || r+2;
    if(dist <= r) critiques.push({...z, dist, nom});
    else if(dist <= a) vigilance.push({...z, dist, nom});
    else if(dist <= 30) informatif.push({...z, dist, nom});
    else if(dist <= 500) lointaines.push({...z, dist, nom});
  });

  critiques.sort((a,b)=>a.dist-b.dist);
  vigilance.sort((a,b)=>a.dist-b.dist);
  informatif.sort((a,b)=>a.dist-b.dist);

  // Banner carte
  const banner = document.getElementById('zones-banner');
  const content = document.getElementById('zones-banner-content');

  if(critiques.length || vigilance.length){
    banner.style.display='block';
    let html='';
    critiques.forEach(z=>{
      html+=`<div style="color:#E74C3C;font-weight:600">🔴 DANS LA ZONE : ${z.nom} — ${z.dist.toFixed(1)}km — ${z.notes}</div>`;
    });
    vigilance.slice(0,3).forEach(z=>{
      html+=`<div style="color:#E67E22">🟠 ${z.nom} — ${z.dist.toFixed(1)}km</div>`;
    });
    content.innerHTML=html;
  } else {
    banner.style.display='none';
  }

  // Stocker pour l'affichage dans l'onglet
  window._zones = {critiques, vigilance, informatif, lointaines};
}

// ═══════════════════════════════════════════════════════
// FUSEAU HORAIRE
// ═══════════════════════════════════════════════════════
async function getTZ(lat, lng) {
  try {
    const ts = Math.floor(Date.now()/1000);
    const r = await fetch(`https://maps.googleapis.com/maps/api/timezone/json?location=${lat},${lng}&timestamp=${ts}&key=${GOOGLE_KEY}`);
    const d = await r.json();
    if(d.status==='OK'){
      tzOffset = d.rawOffset + d.dstOffset;
      tzId = d.timeZoneId;
      const tzShort = d.timeZoneId.split('/').pop().replace('_',' ');
      document.getElementById('tz-display').textContent = `${tzShort} UTC${tzOffset>=0?'+':''}${tzOffset/3600}h`;
    }
  } catch(e){}
}

function localTime(unixTs) {
  const d = new Date((unixTs + tzOffset)*1000);
  return `${String(d.getUTCHours()).padStart(2,'0')}h${String(d.getUTCMinutes()).padStart(2,'0')}`;
}

function localTimeStr(isoStr) {
  // Open-Meteo retourne déjà en heure locale avec timezone=auto
  return isoStr ? isoStr.substring(11,16) : '--:--';
}

async function chargerMeteo(lat, lng) {
  document.getElementById('empty-state').style.display='none';
  document.getElementById('loading-overlay').classList.add('show');

  await getTZ(lat, lng);

  try {
    // Appels parallèles
    const [openMeteo, owm, windy] = await Promise.allSettled([
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&hourly=windspeed_10m,windspeed_80m,windspeed_120m,winddirection_10m,winddirection_80m,windgusts_10m,visibility,cloudcover,cloudcover_low,cloudcover_mid,cloudcover_high,precipitation,precipitation_probability,cape,uv_index,temperature_2m,relativehumidity_2m,apparent_temperature,surface_pressure&daily=temperature_2m_max,temperature_2m_min,windspeed_10m_max,windgusts_10m_max,precipitation_sum,precipitation_probability_max,sunrise,sunset,uv_index_max,weathercode&timezone=auto&forecast_days=16`).then(r=>r.json()),
      fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lng}&appid=${OWM_KEY}&units=metric&lang=fr`).then(r=>r.json()),
      fetch(`https://api.windy.com/api/point-forecast/v2`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({lat,lng,model:'gfs',parameters:['wind','windGust'],levels:['surface','850h','925h','700h','500h'],key:WINDY_KEY})
      }).then(r=>r.json()),
    ]);

    const om = openMeteo.status==='fulfilled' ? openMeteo.value : null;
    const ow = owm.status==='fulfilled' ? owm.value : null;
    const wd = windy.status==='fulfilled' ? windy.value : null;

    donneesMeteo = {om, ow, wd, lat, lng};
    donneesPrev7 = om;
    donneesPrev15 = om;

    // METAR
    await chargerMETAR(lat, lng);

  } catch(e){
    showNotif('Erreur chargement données météo', 'error');
  }

  document.getElementById('loading-overlay').classList.remove('show');
  afficherOnglet();
}

async function chargerMETAR(lat, lng) {
  // Trouver aéroport le plus proche avec ICAO
  const apNear = ZONES.aeroports
    .filter(a=>a.icao && !a.icao.includes('_') && !a.icao.startsWith('H'))
    .map(a=>({...a,dist:haversine(lat,lng,a.lat,a.lng)}))
    .sort((a,b)=>a.dist-b.dist)[0];

  if(apNear && apNear.dist < 100){
    try {
      const r = await fetch(`https://aviationweather.gov/api/data/metar?ids=${apNear.icao}&format=json`);
      const d = await r.json();
      if(d && d.length > 0){
        if(!donneesMeteo) donneesMeteo = {};
        donneesMeteo.metar = d[0];
        donneesMeteo.metar_aeroport = apNear;
      }
    } catch(e){}

    // NOTAMs
    try {
      const rn = await fetch(`https://aviationweather.gov/api/data/notam?location=${apNear.icao}&format=json`);
      const dn = await rn.json();
      if(dn && dn.length > 0){
        donneesMeteo.notams = dn.slice(0,5);
      }
    } catch(e){}
  }
}

// CALCULS
// ═══════════════════════════════════════════════════════
function calculerAltDensite(tempC, pressionHpa, humidite) {
  const altPression = 145366*(1-Math.pow(pressionHpa/1013.25,0.190284));
  const altTemp = 118.8*(tempC-15);
  const altHum = (humidite||50)*0.8;
  return Math.round(altPression+altTemp+altHum);
}

function calculerRosee(tempC, humidite) {
  const a=17.27, b=237.7;
  const gamma=(a*tempC/(b+tempC))+Math.log(humidite/100);
  return Math.round((b*gamma/(a-gamma))*10)/10;
}

function autonomieAir3S(tempC) {
  if(tempC>20) return {min:45,pct:100,txt:"Nominale"};
  if(tempC>10) return {min:40,pct:89,txt:"Légère réduction"};
  if(tempC>0)  return {min:33,pct:73,txt:"Préchauffer batteries"};
  if(tempC>-10)return {min:25,pct:56,txt:"Préchauffer obligatoire"};
  return {min:15,pct:33,txt:"Vol déconseillé"};
}

function statutVol(data){
  if(!data) return {code:'rouge',score:0,raisons:['Données indisponibles'],chips:[]};
  const {om,ow} = data;
  const now = new Date();
  const hi = om ? trouverHoraireActuel(om) : 0;

  const vent = om ? (om.hourly.windspeed_10m[hi]||0) : (ow?.wind?.speed*3.6||0);
  const rafales = om ? (om.hourly.windgusts_10m[hi]||0) : 0;
  const visi = om ? (om.hourly.visibility[hi]||10000)/1000 : (ow?.visibility||10000)/1000;
  const pluie = om ? (om.hourly.precipitation[hi]||0) : 0;
  const pluiePct = om ? (om.hourly.precipitation_probability[hi]||0) : 0;
  const cape = om ? (om.hourly.cape[hi]||0) : 0;
  const nuagesBas = om ? (om.hourly.cloudcover_low[hi]||0) : (ow?.clouds?.all||0);
  const temp = om ? (om.hourly.temperature_2m[hi]||15) : (ow?.main?.temp||15);
  const plafondFt = Math.max(0, (100-nuagesBas)*25); // estimation grossière

  let score = 100;
  const raisons = [], chips = [];

  // Vent
  if(vent>35){score-=35;raisons.push(`Vent ${vent.toFixed(0)} km/h > 35`);chips.push({txt:`Vent ${vent.toFixed(0)} km/h`,cls:'chip-danger'});}
  else if(vent>20){score-=15;chips.push({txt:`Vent ${vent.toFixed(0)} km/h`,cls:'chip-warn'});}
  else chips.push({txt:`Vent ${vent.toFixed(0)} km/h`,cls:'chip-ok'});

  // Rafales
  if(rafales>38){score-=30;raisons.push(`Rafales ${rafales.toFixed(0)} km/h > 38`);chips.push({txt:`Rafales ${rafales.toFixed(0)} km/h`,cls:'chip-danger'});}
  else if(rafales>25){score-=12;chips.push({txt:`Rafales ${rafales.toFixed(0)} km/h`,cls:'chip-warn'});}
  else if(rafales>0) chips.push({txt:`Rafales ${rafales.toFixed(0)} km/h`,cls:'chip-ok'});

  // Pluie
  if(pluie>0){score-=40;raisons.push('Pluie active');chips.push({txt:'Pluie active',cls:'chip-danger'});}
  else if(pluiePct>25){score-=15;chips.push({txt:`Pluie ${pluiePct}%`,cls:'chip-warn'});}
  else chips.push({txt:'Pas de pluie ✓',cls:'chip-ok'});

  // Visibilité
  if(visi<3){score-=25;raisons.push(`Visibilité ${visi.toFixed(1)}km < 3km`);chips.push({txt:`Visi ${visi.toFixed(1)}km`,cls:'chip-danger'});}
  else if(visi<8){score-=8;chips.push({txt:`Visi ${visi.toFixed(1)}km`,cls:'chip-warn'});}
  else chips.push({txt:`Visi ${visi.toFixed(0)}km ✓`,cls:'chip-ok'});

  // Plafond
  if(plafondFt<800){score-=20;raisons.push(`Plafond ~${plafondFt}ft < 800ft`);chips.push({txt:`Plafond ~${plafondFt}ft`,cls:'chip-danger'});}
  else if(plafondFt<1500){score-=8;chips.push({txt:`Plafond ~${plafondFt}ft`,cls:'chip-warn'});}
  else chips.push({txt:`Plafond OK ✓`,cls:'chip-ok'});

  // CAPE
  if(cape>750){score-=20;raisons.push(`CAPE ${cape} J/kg > 750`);chips.push({txt:`CAPE ${cape} J/kg`,cls:'chip-danger'});}
  else if(cape>250){score-=8;chips.push({txt:`CAPE ${cape} J/kg`,cls:'chip-warn'});}
  else chips.push({txt:`CAPE OK ✓`,cls:'chip-ok'});

  // Temp
  if(temp<0||temp>38){score-=15;raisons.push(`Température ${temp.toFixed(0)}°C hors limites`);chips.push({txt:`${temp.toFixed(0)}°C`,cls:'chip-danger'});}
  else if(temp<5||temp>35){score-=5;chips.push({txt:`${temp.toFixed(0)}°C`,cls:'chip-warn'});}
  else chips.push({txt:`${temp.toFixed(0)}°C ✓`,cls:'chip-ok'});

  score = Math.max(0, Math.min(100, score));
  let code = score>=70?'vert':score>=40?'orange':'rouge';

  return {code, score, raisons, chips};
}

function trouverHoraireActuel(om) {
  const now = new Date().toISOString().substring(0,13);
  return om.hourly.time.findIndex(t=>t.startsWith(now)) || 0;
}

function scoreJour(om, dayIdx) {
  if(!om) return {score:50,code:'orange',fenetre:'--'};
  const heures = [];
  for(let h=dayIdx*24; h<(dayIdx+1)*24 && h<om.hourly.windspeed_10m.length; h++){
    const vent=om.hourly.windspeed_10m[h]||0;
    const raf=om.hourly.windgusts_10m[h]||0;
    const pluie=om.hourly.precipitation[h]||0;
    const visi=(om.hourly.visibility[h]||10000)/1000;
    const isDay=om.hourly.time[h];
    const heure=parseInt(isDay.substring(11,13));
    if(heure<6||heure>20) continue;
    const ok = vent<20 && raf<25 && pluie===0 && visi>8;
    const warn = vent<35 && raf<38 && pluie<0.1 && visi>3;
    heures.push({h,heure,ok,warn});
  }
  const vertes=heures.filter(h=>h.ok);
  const oranges=heures.filter(h=>h.warn&&!h.ok);
  const score = Math.round((vertes.length/Math.max(heures.length,1))*100);
  const code = score>=70?'vert':score>=35?'orange':'rouge';
  let fenetre='Aucune';
  if(vertes.length>0){
    const debut=vertes[0].heure, fin=vertes[vertes.length-1].heure;
    fenetre=`${String(debut).padStart(2,'0')}h-${String(fin+1).padStart(2,'0')}h (${vertes.length}h)`;
  }
  return {score,code,fenetre};
}

// ═══════════════════════════════════════════════════════
// DÉCODAGE METAR
// ═══════════════════════════════════════════════════════
function decoderMETAR(metar) {
  if(!metar) return [];
  const lignes=[];
  const raw = typeof metar === 'string' ? metar : (metar.rawOb || JSON.stringify(metar));

  // Station
  const station = raw.match(/^([A-Z]{4})/);
  if(station) lignes.push({key:'Station',val:station[1]});

  // Date/Heure
  const dh = raw.match(/(\d{2})(\d{2})(\d{2})Z/);
  if(dh) lignes.push({key:'Heure obs.',val:`${dh[1]} du mois à ${dh[2]}h${dh[3]} UTC`});

  // Vent
  const vent = raw.match(/(\d{3}|VRB)(\d{2,3})(G(\d{2,3}))?KT/);
  if(vent){
    let vStr = vent[1]==='VRB' ? 'Variable' : `${vent[1]}° (${directionVent(parseInt(vent[1]))})`;
    vStr += ` à ${Math.round(parseInt(vent[2])*1.852)} km/h`;
    if(vent[4]) vStr += ` rafales ${Math.round(parseInt(vent[4])*1.852)} km/h`;
    lignes.push({key:'Vent',val:vStr});
  }

  // Visibilité
  const vis = raw.match(/\s(\d{4})\s/);
  if(vis) lignes.push({key:'Visibilité',val:`${parseInt(vis[1])} mètres`});
  const visSM = raw.match(/\s(\d+)SM\s/);
  if(visSM) lignes.push({key:'Visibilité',val:`${(parseInt(visSM[1])*1.609).toFixed(1)} km`});

  // Nuages
  const nuages = raw.matchAll(/(FEW|SCT|BKN|OVC)(\d{3})/g);
  for(const n of nuages){
    const cov={FEW:'Quelques nuages (1-2/8)',SCT:'Nuages épars (3-4/8)',BKN:'Ciel fragmenté (5-7/8)',OVC:'Couverture totale (8/8)'};
    lignes.push({key:'Nuages',val:`${cov[n[1]]||n[1]} base ${parseInt(n[2])*100} pieds AGL`});
  }

  // Temp/Rosée
  const temp = raw.match(/\s(M?\d{2})\/(M?\d{2})\s/);
  if(temp){
    const t=temp[1].replace('M','-'), r=temp[2].replace('M','-');
    lignes.push({key:'Temp/Rosée',val:`${t}°C / ${r}°C`});
  }

  // Pression
  const pression = raw.match(/[AQ](\d{4})/);
  if(pression){
    const val=pression[0].startsWith('A')?`${parseInt(pression[1])/100} inHg`:`${pression[1]} hPa`;
    lignes.push({key:'Pression',val});
  }

  // Phénomènes
  const phenomenes={'-RA':'Pluie légère','RA':'Pluie modérée','+RA':'Pluie forte','-SN':'Neige légère','SN':'Neige','FG':'Brouillard','BR':'Brume','TS':'Orage','TSRA':'Orage avec pluie','-DZ':'Bruine légère','DZ':'Bruine','FZRA':'Pluie verglaçante','FZDZ':'Bruine verglaçante'};
  for(const [code,desc] of Object.entries(phenomenes)){
    if(raw.includes(code)) lignes.push({key:'Phénomènes',val:`⚠️ ${desc}`});
  }

  return lignes;
}

// ─── ONGLET 2 ───────────────────────────────────────────
function afficherOnglet2() {
  const om = donneesPrev7;
  if(!om){document.getElementById('tab-content').innerHTML='<div class="empty-state"><div class="empty-icon">📅</div><p>Sélectionnez un point sur la carte</p></div>';return;}

  const jours=[];
  for(let i=0;i<7;i++){
    const s=scoreJour(om,i);
    const dt=new Date(om.daily.time[i]);
    jours.push({
      date:om.daily.time[i],
      jour:dt.toLocaleDateString('fr-CA',{weekday:'short'}),
      dateStr:dt.toLocaleDateString('fr-CA',{day:'numeric',month:'short'}),
      tempMax:om.daily.temperature_2m_max[i],
      tempMin:om.daily.temperature_2m_min[i],
      ventMax:om.daily.windspeed_10m_max[i],
      rafMax:om.daily.windgusts_10m_max[i],
      pluie:om.daily.precipitation_sum[i],
      pluiePct:om.daily.precipitation_probability_max[i],
      uv:om.daily.uv_index_max[i],
      wmo:om.daily.weathercode[i],
      sunrise:localTimeStr(om.daily.sunrise[i]),
      sunset:localTimeStr(om.daily.sunset[i]),
      score:s.score, code:s.code, fenetre:s.fenetre,
    });
  }

  const ventMax7=jours.map(j=>j.ventMax);
  const rafMax7=jours.map(j=>j.rafMax);
  const pluie7=jours.map(j=>j.pluie);
  const tempMax7=jours.map(j=>j.tempMax);
  const tempMin7=jours.map(j=>j.tempMin);
  const labels7=jours.map(j=>j.jour);

  document.getElementById('tab-content').innerHTML=`
    <!-- CALENDRIER 7 JOURS -->
    <div class="days-grid" id="days-grid7">
      ${jours.map((j,i)=>`
        <div class="day-card ${j.code}" onclick="toggleDayDetail(${i})" id="day-card-${i}">
          <div class="day-name">${j.jour.toUpperCase()}</div>
          <div class="day-date">${j.dateStr}</div>
          <div class="day-icon">${iconeMeteo(j.wmo)}</div>
          <div class="day-temp">${Math.round(j.tempMax)}° / ${Math.round(j.tempMin)}°</div>
          <div class="day-wind">💨 ${j.ventMax?.toFixed(0)} km/h</div>
          <div class="day-score ${j.code}">${j.score}</div>
          <div class="day-window">${j.fenetre}</div>
        </div>
      `).join('')}
    </div>

    <!-- DÉTAIL JOUR (placeholder) -->
    <div id="day-detail"></div>

    <!-- GRAPHIQUES -->
    <div class="card">
      <div class="card-title"><span class="icon">💨</span>Vent sur 7 jours</div>
      <div class="chart-container"><canvas id="chart-vent7"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title"><span class="icon">🌧</span>Précipitations 7 jours</div>
      <div class="chart-container"><canvas id="chart-pluie7"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title"><span class="icon">🌡</span>Températures 7 jours</div>
      <div class="chart-container"><canvas id="chart-temp7"></canvas></div>
    </div>

    <!-- HEATMAP VENT -->
    <div class="card">
      <div class="card-title"><span class="icon">🔥</span>Carte thermique vent — 7 jours × 8 tranches 3h</div>
      <div class="heatmap" id="heatmap-vent"></div>
    </div>

    <!-- ZONES -->
    <div class="card">
      <div class="card-title"><span class="icon">🗺</span>Zones aériennes</div>
      ${genZonesHTML()}
      <a class="navdrone-btn" href="https://portal.navdrone.ca/?lat=${pointActif?.lat}&lng=${pointActif?.lng}" target="_blank">🛫 Vérifier sur NavDrone</a>
    </div>
  `;

  requestAnimationFrame(()=>{
    // Graphique vent
    const ctx=document.getElementById('chart-vent7')?.getContext('2d');
    if(ctx){
      new Chart(ctx,{type:'line',data:{labels:labels7,datasets:[
        {label:'Vent max km/h',data:ventMax7,borderColor:'#3AABEF',backgroundColor:'rgba(58,171,239,0.1)',tension:0.3,fill:true},
        {label:'Rafales max km/h',data:rafMax7,borderColor:'#E67E22',borderDash:[4,4],tension:0.3,pointRadius:2},
      ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#6B7C93',font:{size:10}}}},scales:{x:{ticks:{color:'#6B7C93'},grid:{color:'#1A3050'}},y:{ticks:{color:'#6B7C93'},grid:{color:'#1A3050'},min:0}}}});
    }
    const ctx2=document.getElementById('chart-pluie7')?.getContext('2d');
    if(ctx2){
      new Chart(ctx2,{type:'bar',data:{labels:labels7,datasets:[
        {label:'Précip. mm',data:pluie7,backgroundColor:'rgba(58,171,239,0.5)'},
      ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#6B7C93',font:{size:10}}}},scales:{x:{ticks:{color:'#6B7C93'},grid:{color:'#1A3050'}},y:{ticks:{color:'#6B7C93'},grid:{color:'#1A3050'},min:0}}}});
    }
    const ctx3=document.getElementById('chart-temp7')?.getContext('2d');
    if(ctx3){
      new Chart(ctx3,{type:'line',data:{labels:labels7,datasets:[
        {label:'Max °C',data:tempMax7,borderColor:'#E74C3C',backgroundColor:'rgba(231,76,60,0.1)',tension:0.3,fill:'+1'},
        {label:'Min °C',data:tempMin7,borderColor:'#3AABEF',backgroundColor:'rgba(58,171,239,0.1)',tension:0.3,fill:false},
      ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#6B7C93',font:{size:10}}}},scales:{x:{ticks:{color:'#6B7C93'},grid:{color:'#1A3050'}},y:{ticks:{color:'#6B7C93'},grid:{color:'#1A3050'}}}}});
    }

    // Heatmap
    const hm=document.getElementById('heatmap-vent');
    if(hm&&om){
      let html='<div class="hm-label"></div>';
      [0,3,6,9,12,15,18,21].forEach(h=>html+=`<div class="hm-time">${String(h).padStart(2,'0')}h</div>`);
      for(let d=0;d<7;d++){
        html+=`<div class="hm-label">${jours[d].jour}</div>`;
        [0,3,6,9,12,15,18,21].forEach(offset=>{
          const idx=d*24+offset;
          const v=om.hourly.windspeed_10m[idx]||0;
          const bg=v<20?'rgba(39,174,96,0.6)':v<35?'rgba(230,126,34,0.6)':'rgba(231,76,60,0.6)';
          html+=`<div class="hm-cell" style="background:${bg}">${v.toFixed(0)}</div>`;
        });
      }
      hm.innerHTML=html;
    }
  });
}

function toggleDayDetail(idx) {
  const om=donneesPrev7;
  if(!om) return;
  const el=document.getElementById('day-detail');
  const card=document.getElementById(`day-card-${idx}`);
  if(card.classList.contains('selected')){
    card.classList.remove('selected');el.innerHTML='';return;
  }
  document.querySelectorAll('.day-card').forEach(c=>c.classList.remove('selected'));
  card.classList.add('selected');
  const base=idx*24;
  const labels=om.hourly.time.slice(base,base+24).map(t=>t.substring(11,16));
  const vents=om.hourly.windspeed_10m.slice(base,base+24);
  el.innerHTML=`
    <div class="card">
      <div class="card-title"><span class="icon">📊</span>Détail ${new Date(om.daily.time[idx]).toLocaleDateString('fr-CA',{weekday:'long',day:'numeric',month:'long'})}</div>
      <div class="chart-container"><canvas id="chart-day-detail"></canvas></div>
    </div>
  `;
  requestAnimationFrame(()=>{
    const ctx=document.getElementById('chart-day-detail')?.getContext('2d');
    if(ctx) new Chart(ctx,{type:'line',data:{labels,datasets:[{label:'Vent km/h',data:vents,borderColor:'#3AABEF',backgroundColor:'rgba(58,171,239,0.1)',tension:0.4,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#6B7C93',font:{size:9},maxTicksLimit:8},grid:{color:'#1A3050'}},y:{ticks:{color:'#6B7C93',font:{size:9}},grid:{color:'#1A3050'},min:0}}}});
  });
}

function afficherOnglet3() {
  const om=donneesPrev15;
  if(!om){document.getElementById('tab-content').innerHTML='<div class="empty-state"><div class="empty-icon">📆</div><p>Sélectionnez un point sur la carte</p></div>';return;}

  const jours=[];
  for(let i=0;i<16;i++){
    const s=scoreJour(om,i);
    const dt=new Date(om.daily.time[i]);
    jours.push({
      date:om.daily.time[i],
      jour:dt.toLocaleDateString('fr-CA',{weekday:'short'}),
      dateStr:dt.toLocaleDateString('fr-CA',{day:'numeric',month:'short'}),
      tempMax:om.daily.temperature_2m_max[i],
      tempMin:om.daily.temperature_2m_min[i],
      ventMax:om.daily.windspeed_10m_max[i],
      rafMax:om.daily.windgusts_10m_max[i],
      pluiePct:om.daily.precipitation_probability_max[i],
      wmo:om.daily.weathercode[i],
      score:s.score, code:s.code, fenetre:s.fenetre,
      fiable:i<7,
    });
  }

  // Résumé hebdo
  const sem1=jours.slice(0,7), sem2=jours.slice(7,14);
  const s1Verts=sem1.filter(j=>j.code==='vert').length;
  const s2Verts=sem2.filter(j=>j.code==='vert').length;
  const s1Best=sem1.reduce((a,b)=>a.score>b.score?a:b);
  const s2Best=sem2.reduce((a,b)=>a.score>b.score?a:b);

  // Fenêtres multi-jours
  const fenetres=[];
  let debut=-1,streak=0;
  jours.forEach((j,i)=>{
    if(j.code==='vert'){if(debut===-1)debut=i;streak++;}
    else{if(streak>=2)fenetres.push({debut,fin:i-1,count:streak});debut=-1;streak=0;}
  });
  if(streak>=2)fenetres.push({debut,fin:jours.length-1,count:streak});

  // Tendance
  const tendance=[]
  for(let i=1;i<jours.length;i++) tendance.push(jours[i].score-jours[i-1].score);
  const trendGlobal=tendance.reduce((a,b)=>a+b,0);

  document.getElementById('tab-content').innerHTML=`
    <!-- RÉSUMÉ HEBDO -->
    <div class="weekly-summary">
      <div class="week-block">
        <div class="week-title">Semaine 1 — J+1 à J+7</div>
        <div class="week-stat">${s1Verts}/7</div>
        <div class="week-sub">jours favorables • Meilleur: ${s1Best.dateStr} (${s1Best.score}/100)</div>
      </div>
      <div class="week-block">
        <div class="week-title">Semaine 2 — J+8 à J+14 <span class="confidence-badge">Fiabilité réduite</span></div>
        <div class="week-stat">${s2Verts}/7</div>
        <div class="week-sub">jours favorables • Tendance ${trendGlobal>0?'↗ amélioration':'↘ dégradation'}</div>
      </div>
    </div>

    <!-- FENÊTRES MULTI-JOURS -->
    ${fenetres.length?`
      <div class="card" style="border-color:rgba(39,174,96,0.4)">
        <div class="card-title"><span class="icon">✅</span>Fenêtres de vol favorables — ${fenetres.length} détectée(s)</div>
        ${fenetres.map(f=>`
          <div class="window-favorable">
            <div class="window-favorable-title">📅 ${jours[f.debut].dateStr} → ${jours[f.fin].dateStr} — ${f.count} jours consécutifs</div>
            <div style="font-size:11px;color:var(--gray-light)">Score moyen: ${Math.round(jours.slice(f.debut,f.fin+1).reduce((a,b)=>a+b.score,0)/f.count)}/100</div>
          </div>
        `).join('')}
      </div>` : ''}

    <!-- LISTE 15 JOURS -->
    <div class="card">
      <div class="card-title"><span class="icon">📆</span>Prévisions 15 jours</div>
      <div class="list-header">
        <div>Date</div><div>Conditions</div><div>Vent max</div><div>Pluie</div><div>Score</div><div></div><div>Fenêtre</div>
      </div>
      <div class="days-list">
        ${jours.map(j=>`
          <div class="list-row ${j.code==='vert'?'favorable':''} ${!j.fiable?'low-confidence':''}">
            <div><b>${j.jour}</b> ${j.dateStr}${!j.fiable?` <span class="confidence-badge">~</span>`:''}</div>
            <div>${iconeMeteo(j.wmo)} ${Math.round(j.tempMax)}°/${Math.round(j.tempMin)}°C</div>
            <div style="color:${couleurVent(j.ventMax)}">${j.ventMax?.toFixed(0)} km/h</div>
            <div>${j.pluiePct}%</div>
            <div style="color:${j.code==='vert'?'var(--green-light)':j.code==='orange'?'var(--orange)':'var(--red)'};font-weight:700">${j.score}</div>
            <div>${j.code==='vert'?'🟢':j.code==='orange'?'🟠':'🔴'}</div>
            <div style="font-size:10px;color:var(--teal)">${j.fenetre}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- GRAPHIQUE TENDANCE 15J -->
    <div class="card">
      <div class="card-title"><span class="icon">📈</span>Tendance vent — 15 jours</div>
      <div class="chart-container"><canvas id="chart-vent15"></canvas></div>
    </div>

    <!-- ZONES -->
    <div class="card">
      <div class="card-title"><span class="icon">🗺</span>Zones aériennes</div>
      ${genZonesHTML()}
      <a class="navdrone-btn" href="https://portal.navdrone.ca/?lat=${pointActif?.lat}&lng=${pointActif?.lng}" target="_blank">🛫 Vérifier sur NavDrone</a>
    </div>
  `;

  requestAnimationFrame(()=>{
    const ctx=document.getElementById('chart-vent15')?.getContext('2d');
    if(ctx) new Chart(ctx,{
      type:'line',
      data:{
        labels:jours.map(j=>j.jour+' '+j.dateStr.split(' ')[0]),
        datasets:[
          {label:'Vent max km/h',data:jours.map(j=>j.ventMax),borderColor:'#3AABEF',backgroundColor:'rgba(58,171,239,0.1)',tension:0.3,fill:true,pointRadius:3},
          {label:'Rafales max km/h',data:jours.map(j=>j.rafMax),borderColor:'#E67E22',borderDash:[4,4],tension:0.3,pointRadius:0},
        ]
      },
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#6B7C93',font:{size:10}}}},scales:{x:{ticks:{color:'#6B7C93',font:{size:9},maxRotation:45},grid:{color:'#1A3050'}},y:{ticks:{color:'#6B7C93',font:{size:9}},grid:{color:'#1A3050'},min:0}}}
    });
  });
}

function genZonesHTML(){
  const zones=window._zones||{critiques:[],vigilance:[],informatif:[]};
  return `
    ${zones.critiques.map(z=>`<div class="zone-item"><div class="zone-dot rouge"></div><div class="zone-info"><div class="zone-name">🔴 ${z.nom}</div><div class="zone-dist">${z.dist?.toFixed(1)}km — DANS LA ZONE</div></div></div>`).join('')}
    ${zones.vigilance.map(z=>`<div class="zone-item"><div class="zone-dot orange"></div><div class="zone-info"><div class="zone-name">🟠 ${z.nom}</div><div class="zone-dist">${z.dist?.toFixed(1)}km</div></div></div>`).join('')}
    ${zones.informatif.slice(0,3).map(z=>`<div class="zone-item"><div class="zone-dot jaune"></div><div class="zone-info"><div class="zone-name">🟡 ${z.nom}</div><div class="zone-dist">${z.dist?.toFixed(1)}km</div></div></div>`).join('')}
    ${(!zones.critiques.length&&!zones.vigilance.length)?'<div style="color:var(--green);font-size:12px">✅ Aucune zone critique dans un rayon de 30km</div>':''}
  `;
}

// FICHES POPUP
// ═══════════════════════════════════════════════════════
function afficherFiche(id) {
  const f=FICHES[id];
  if(!f) return;
  const popup=document.getElementById('info-popup');
  document.getElementById('popup-title').textContent=f.titre;
  document.getElementById('popup-subtitle').textContent=f.subtitle;
  document.getElementById('popup-body').innerHTML=`
    <div class="popup-section"><div class="popup-section-title">C'est quoi</div><div class="popup-text">${f.cest_quoi}</div></div>
    <div class="popup-section"><div class="popup-section-title">Pour ton vol Air 3S</div><div class="popup-text">${f.pour_ton_vol}</div></div>
    <div class="popup-section"><div class="popup-section-title">Exemple concret</div><div class="popup-text">${f.exemple}</div></div>
    <div class="popup-section"><div class="popup-section-title">Seuils CapturAir</div>
      <div class="popup-seuils">
        <span class="metric-badge badge-ok">🟢 ${f.seuils.vert}</span>
        <span class="metric-badge badge-warn">🟠 ${f.seuils.orange}</span>
        <span class="metric-badge badge-danger">🔴 ${f.seuils.rouge}</span>
      </div>
    </div>
    <div class="popup-error">⚠️ Erreur fréquente : ${f.erreur}</div>
  `;
  // Positionner
  popup.style.right='16px';
  popup.style.top='80px';
  popup.classList.add('show');
}

function fermerPopup() {
  document.getElementById('info-popup').classList.remove('show');
}

// Fermer popup en cliquant ailleurs
document.addEventListener('click', e => {
  const popup=document.getElementById('info-popup');
  if(popup.classList.contains('show') && !popup.contains(e.target) && !e.target.closest('.metric')) {
    fermerPopup();
  }
});

// NOTIFICATIONS
// ═══════════════════════════════════════════════════════
function showNotif(msg, type='info') {
  const el=document.getElementById('notif');
  el.textContent=msg;
  el.className=`show ${type}`;
  setTimeout(()=>el.classList.remove('show'),3000);
}
